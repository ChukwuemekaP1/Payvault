[package]
name = "payvault"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "cors"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

# Redis
deadpool-redis = { version = "0.18", features = ["rt_tokio_1"] }
deadpool = { version = "0.12", features = ["rt_tokio_1"] }

# Authentication & Security
argon2 = "0.5"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Serialization & Validation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Error handling
thiserror = "2"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }

# Random number generation
rand = "0.8"

# HTTP client for webhooks
reqwest = { version = "0.12", features = ["json"] }

# MD5 for token hashing
md5 = "0.7"

# Additional Axum utilities
axum-extra = { version = "0.10", features = ["typed-header", "query"] }

# Futures
futures-util = "0.3"
